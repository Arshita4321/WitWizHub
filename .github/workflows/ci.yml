name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:

  
  setup-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build


 
  build-image:
    runs-on: ubuntu-latest
    needs: setup-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Docker Username
        run: echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      
      - name: Build Backend Image
        run: |
          docker build -t $DOCKER_USERNAME/witwizhub-backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t $DOCKER_USERNAME/witwizhub-frontend:latest ./frontend

      
      - name: Show Built Images
        run: docker images

    
      - name: Save Backend Image
        run: |
          docker save $DOCKER_USERNAME/witwizhub-backend:latest | gzip > backend.tar.gz

      - name: Save Frontend Image
        run: |
          docker save $DOCKER_USERNAME/witwizhub-frontend:latest | gzip > frontend.tar.gz

     
      - name: Upload Backend Image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar.gz

      - name: Upload Frontend Image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend.tar.gz


  
  push-image:
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Docker Username
        run: echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      
      - name: Download Backend Image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: .

      - name: Download Frontend Image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: .

      
      - name: Load Backend Image
        run: |
          gunzip -c backend.tar.gz | docker load

      - name: Load Frontend Image
        run: |
          gunzip -c frontend.tar.gz | docker load

      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend Image
        run: docker push $DOCKER_USERNAME/witwizhub-backend:latest

      - name: Push Frontend Image
        run: docker push $DOCKER_USERNAME/witwizhub-frontend:latest