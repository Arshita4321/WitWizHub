name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:

  # 🔹 1. Setup & Build (basic validation)
  setup-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  # 🔹 2. Create Docker Images
  create-image:
    runs-on: ubuntu-latest
    needs: setup-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Backend Image
        run: docker build -t witwizhub-backend ./backend

      - name: Build Frontend Image
        run: docker build -t witwizhub-frontend ./frontend

  # 🔹 3. Push Images to DockerHub
  push-image:
    runs-on: ubuntu-latest
    needs: create-image

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Backend Image
        run: docker tag witwizhub-backend ${{ secrets.DOCKER_USERNAME }}/witwizhub-backend:latest

      - name: Tag Frontend Image
        run: docker tag witwizhub-frontend ${{ secrets.DOCKER_USERNAME }}/witwizhub-frontend:latest

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/witwizhub-backend:latest

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/witwizhub-frontend:latest