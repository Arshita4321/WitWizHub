name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend
        run: |
          cd backend && npm install

      - name: Install Frontend
        run: |
          cd frontend && npm install

      - name: Build Frontend
        run: |
          cd frontend && npm run build

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/witwizhub-backend:latest ./backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/witwizhub-frontend:latest ./frontend

          docker push ${{ secrets.DOCKER_USERNAME }}/witwizhub-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/witwizhub-frontend:latest
      
      - name: Trigger Jenkins Deployment
        run: |
          curl "http://localhost:8080/job/witwizhub-deploy/build?token=witwizhubdeploy123"